<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800&family=Barlow+Condensed:wght@800;900&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}
body{width:1024px;height:1536px;position:relative;overflow:hidden;font-family:Barlow,sans-serif;background:#000}
.bg{position:absolute;inset:0;background:url(maquina777.jpg) center/cover}
.ft{position:absolute;left:0;right:0;top:0;height:330px;background:linear-gradient(#000 35%,transparent)}
.fb{position:absolute;left:0;right:0;bottom:0;height:470px;background:linear-gradient(transparent,rgba(0,0,0,.92) 45%)}
.t{position:absolute;top:26px;left:0;right:0;text-align:center;color:#fff}
.pill{display:inline-block;background:#c8f520;color:#043434;font-weight:800;font-size:38px;padding:10px 30px;border-radius:99px;letter-spacing:1px;box-shadow:0 0 40px rgba(200,245,32,.7)}
.big{font-family:"Barlow Condensed";font-weight:900;font-size:96px;line-height:.95;margin-top:18px;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.b{position:absolute;bottom:48px;left:0;right:0;text-align:center;color:#fff}
.hasta{font-family:"Barlow Condensed";font-weight:800;font-size:58px;text-transform:uppercase;letter-spacing:1px}
.money{font-family:"Barlow Condensed";font-weight:900;font-size:200px;line-height:.9;background:linear-gradient(180deg,#fff7c2,#ffd54a 45%,#e0a100);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 24px rgba(255,200,40,.55)) drop-shadow(0 4px 0 #7a5200)}
.dto{font-family:"Barlow Condensed";font-weight:800;font-size:54px;text-transform:uppercase;margin-top:6px}
.dto b{color:#c8f520}
.small{font-size:30px;font-weight:700;margin-top:16px;color:#e8e8e8}
</style></head><body><div class="bg"></div><div class="ft"></div><div class="fb"></div>
<div class="t"><img src="logo.png" style="height:56px;filter:brightness(0) invert(1);display:block;margin:0 auto 14px"><span class="pill">🎰 JUEGA GRATIS HOY</span><div class="big">Tienes 3 tiros<br>gratis hoy</div></div>
<div class="b"><div class="hasta">Gana hasta</div><div class="money">$26.900</div><div class="dto">de descuento <b>+ semilla de regalo</b></div><div class="small">Toca el enlace del mensaje 👇 · Vence a medianoche</div></div>
</body></html>
