<title>Comercializadora del Rey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Sede virtual de Comercializadora del Rey. Escena 3D a pantalla completa; encima, paneles de vidrio grafito con borde dorado:
   arriba la barra de modos y KPI reales; izquierda los pisos; derecha el panel de contexto (agente · reunión · calidad ISO 9001);
   abajo la actividad real de hoy. Tema oscuro fijo (escena nocturna). */
:root{
  --noche:#0b0c0b; --vidrio:rgba(16,18,17,.86); --borde:rgba(230,190,110,.32); --borde2:rgba(255,255,255,.08);
  --texto:#f1f2ee; --suave:#a9aea6; --verde:#7ed957; --oro:#e9b84f; --alerta:#ff7a59; --azul:#5aa9ff; --morado:#a77bff;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --cuerpo:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--noche);color:var(--texto);font-family:var(--cuerpo);overflow:hidden}
#escena{position:fixed;inset:0}
.vidrio{position:fixed;background:var(--vidrio);border:1px solid var(--borde);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
button{font:inherit;color:inherit}
#barra{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:8px 12px;max-width:calc(100% - 28px);overflow-x:auto}
#barra .modo{display:flex;gap:4px}
#barra .modo button,.tabs button,.pisos button,.accion{all:unset;cursor:pointer;padding:6px 10px;border-radius:9px;font-size:13px;white-space:nowrap;border:1px solid var(--borde2)}
#barra .modo button[aria-pressed="true"],.tabs button[aria-pressed="true"],.pisos button[aria-pressed="true"]{background:rgba(233,184,79,.16);border-color:var(--borde);color:var(--oro)}
button:focus-visible,.accion:focus-visible{outline:2px solid var(--oro)}
.kpis{display:flex;gap:14px;padding-left:12px;border-left:1px solid var(--borde2)}
.kpis small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);white-space:nowrap}
.kpis b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pisos{top:calc(70px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:10px;width:200px;display:grid;gap:6px}
.pisos button{display:block;padding:9px 10px}
.pisos button b{display:block;font-family:var(--display);font-size:16px}
.pisos button span{font-size:12px;color:var(--suave)}
.pisos h2,#contexto h2,#actividad h2{margin:0 0 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);font-weight:600}
#contexto{top:calc(70px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 290px);overflow:auto;padding:12px}
.tabs{display:flex;gap:4px;margin-bottom:10px}
#contexto h3{margin:2px 0;font-family:var(--display);font-size:20px}
#contexto p{font-size:13px;line-height:1.45;margin:4px 0 8px}
.cargo{font-size:13px;color:var(--suave)}
.pill{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--suave);vertical-align:middle}
.pill.on{background:rgba(126,217,87,.18);color:var(--verde)} .pill.obra{background:rgba(233,184,79,.15);color:var(--oro)} .pill.humano{background:rgba(255,122,89,.15);color:var(--alerta)}
.item{border-top:1px solid var(--borde2);padding:7px 0;font-size:12.5px;line-height:1.4;color:var(--suave)}
.item b{color:var(--texto)} .mono{font-family:var(--mono);color:var(--oro);font-size:11.5px}
.sec{margin-top:10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--oro)}
.accion{display:inline-block;margin:6px 6px 0 0;background:rgba(233,184,79,.14);border-color:var(--borde);color:var(--oro);font-weight:600}
.phva{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.phva div{border-radius:9px;padding:7px;font-size:12px;line-height:1.35;background:rgba(255,255,255,.04)}
.phva b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#actividad{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:430px;padding:10px 12px;max-height:180px;overflow:hidden}
#actividad ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#actividad li{font-size:12.5px;line-height:1.35}
#actividad li .h{font-family:var(--mono);color:var(--oro);font-size:11.5px;margin-right:6px}
#ayuda{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));padding:8px 12px;font-size:12px;color:var(--suave)}
@media (max-width:900px){
  .pisos{top:auto;bottom:calc(200px + env(safe-area-inset-bottom,0px));width:auto;display:flex;padding:6px}
  .pisos h2,.pisos button span{display:none}
  .pisos button b{font-size:13px}
  #contexto{top:auto;bottom:calc(254px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));width:auto;max-height:30%}
  #actividad{width:auto;right:max(12px,env(safe-area-inset-right,0px));max-height:180px}
  #ayuda{display:none}
  .kpis{display:none}
}
</style>

<canvas id="escena" aria-label="Sede virtual de Comercializadora del Rey en 3D"></canvas>
<nav id="barra" class="vidrio" aria-label="Modos de vista">
  <div class="modo" role="group">
    <button id="m_edificio" aria-pressed="true">Edificio</button>
    <button id="m_piso" aria-pressed="false">Piso</button>
    <button id="m_seguir" aria-pressed="false">Seguir agente</button>
    <button id="m_pantallas" aria-pressed="false">Pantallas</button>
  </div>
  <div class="kpis">
    <div><small>Vendido hoy</small><b id="k_ven"></b></div>
    <div><small>Pedidos hoy</small><b id="k_ped"></b></div>
    <div><small>Robot confirmó</small><b id="k_rob"></b></div>
    <div><small>Entrega · 90</small><b id="k_ent"></b></div>
    <div><small>Devolución · 3</small><b id="k_dev"></b></div>
    <div><small>Cancelación · 7</small><b id="k_can"></b></div>
    <div><small>Equipo al día</small><b id="k_sal"></b></div>
  </div>
</nav>
<section class="pisos vidrio" aria-label="Pisos">
  <h2>Pisos</h2>
  <button data-piso="2" aria-pressed="false"><b>Piso 3</b><span>Creatividad, contenido y estrategia</span></button>
  <button data-piso="1" aria-pressed="false"><b>Piso 2</b><span>Centro de operaciones IA</span></button>
  <button data-piso="0" aria-pressed="false"><b>Piso 1</b><span>Recepción, bodega y despachos</span></button>
</section>
<aside id="contexto" class="vidrio" aria-live="polite">
  <div class="tabs" role="tablist">
    <button data-tab="agente" aria-pressed="true">Agente</button>
    <button data-tab="reunion" aria-pressed="false">Reunión</button>
    <button data-tab="calidad" aria-pressed="false">Calidad ISO 9001</button>
  </div>
  <div id="cuerpo"></div>
</aside>
<section id="actividad" class="vidrio" aria-live="polite"><h2 id="act_titulo">Actividad real de hoy</h2><ol id="lista"></ol></section>
<div id="ayuda" class="vidrio">Toca un piso o una persona · arrastra para girar · rueda o pellizco para acercar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATOS = /*DATOS*/null || {pisos:[], eventos:[], reunion:{}, iso:{}};
const $ = id => document.getElementById(id);
const pesos = n => '$' + Math.round(n||0).toLocaleString('es-CO');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K = DATOS.kpi || {}, SAL = DATOS.salud || {};
$('k_ven').textContent = pesos(DATOS.vendido); $('k_ped').textContent = DATOS.pedidos ?? '—'; $('k_rob').textContent = DATOS.conf_robot ?? '—';
[['k_ent', K.entrega, v => v >= 90], ['k_dev', K.devolucion, v => v <= 3], ['k_can', K.cancelacion, v => v <= 7]].forEach(([id, v, ok]) => {
  const el = $(id); el.textContent = v == null ? '—' : v + ' %'; if (v != null) el.style.color = ok(v) ? 'var(--verde)' : 'var(--alerta)'; });
{ const el = $('k_sal'); el.textContent = SAL.revisados ? `${SAL.ok}/${SAL.revisados}` : '—'; el.style.color = (SAL.fallas||[]).length ? 'var(--alerta)' : 'var(--verde)'; }

function bogota(){ const d = new Date(Date.now() - 5*3600e3); return {h:d.getUTCHours(), m:d.getUTCMinutes()}; }
function trabaja(a){ const {h,m} = bogota(); return a.horas.includes(h) && a.min.some(x => m >= x && m < x + 12); }
function proxima(a){ const {h,m} = bogota(); if (!a.horas.length) return null;
  for (let add = 1; add < 1440; add++){ const t = h*60 + m + add, hh = Math.floor(t/60) % 24, mm = t % 60;
    if (a.horas.includes(hh) && a.min.includes(mm)) return `${(hh%12)||12}:${String(mm).padStart(2,'0')} ${hh<12?'a. m.':'p. m.'}`; } return null; }
const CARGOS = {}; (DATOS.pisos || []).forEach(p => p.agentes.forEach(c => CARGOS[c.nombre] = c));
const corto = n => ((CARGOS[n] && CARGOS[n].persona) || n || '').split(' ')[0];

// ================= ESCENA =================
const canvas = $('escena');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0a101a'); scene.fog = new THREE.Fog('#0a101a', 75, 150);
const camera = new THREE.PerspectiveCamera(36, 1, .1, 400);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minDistance = 3; controls.maxDistance = 85; controls.maxPolarAngle = Math.PI*.52;
scene.add(new THREE.HemisphereLight('#ffe6c4', '#151a16', .42));
const llave = new THREE.DirectionalLight('#ffe3bd', .55); llave.position.set(-12, 30, 26); llave.castShadow = true;
llave.shadow.mapSize.set(2048, 2048); Object.assign(llave.shadow.camera, {left:-20, right:20, top:16, bottom:-4, near:1, far:80}); llave.shadow.bias = -.0004; scene.add(llave);

const S = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.7, metalness:0}, o));
const E = c => new THREE.MeshBasicMaterial({color:c});
const GEO_CAJA = new THREE.BoxGeometry(1, 1, 1);
function caja(w, h, d, mat, x, y, z, padre = scene, sombra = true){ const m = new THREE.Mesh(GEO_CAJA, mat); m.scale.set(w, h, d); m.position.set(x, y, z); m.castShadow = m.receiveShadow = sombra; padre.add(m); return m; }
const W = 30, D = 12, H = 4.2, YS = [0, H, 2*H];
const MAT = {
  nogal: S('#6b4428', {roughness:.55}), roble: S('#a9774a', {roughness:.6}), concreto: S('#8a8b88', {roughness:.32, metalness:.05}),
  concretoOsc: S('#3a3c3d', {roughness:.4}), grafito: S('#1d1f21', {roughness:.5, metalness:.35}), negro: S('#121314', {roughness:.45, metalness:.4}),
  blanco: S('#efebe3', {roughness:.45}), oro: S('#c9a24a', {roughness:.3, metalness:.85}), hoja: S('#3f8a3a', {roughness:.8}),
  carton: S('#c49a63', {roughness:.85}), rack: S('#2b3f6e', {roughness:.45, metalness:.5}), rackN: S('#d26a2a', {roughness:.5, metalness:.4}),
  vidrio: new THREE.MeshStandardMaterial({color:'#cfe8ee', transparent:true, opacity:.14, roughness:.05, metalness:.3, depthWrite:false}),
  piel:['#f1c7a5','#d9a27c','#b97f5a','#8d5a3b'].map(c => S(c, {roughness:.6})), pelo:['#2b1d14','#4a3022','#151515','#7a5230'].map(c => S(c, {roughness:.8}))
};
const LED = E('#ffcf8a');

// --------- Instancias (rendimiento): hojas y cajas repetidas ---------
const hojas = [], cajas = [];
function hojaEn(x, y, z, s){ hojas.push([x, y, z, s]); }
function cajaEn(x, y, z, w, h, d){ cajas.push([x, y, z, w, h, d]); }
function planta(x, y, z, s = 1){ caja(.55*s, .6*s, .55*s, MAT.grafito, x, y + .3*s, z); caja(.58*s, .04*s, .58*s, MAT.oro, x, y + .6*s, z, scene, false);
  for (let i = 0; i < 7; i++) hojaEn(x + (Math.random()-.5)*.55*s, y + (.85 + Math.random()*.9)*s, z + (Math.random()-.5)*.55*s, (.22 + Math.random()*.12)*s); }
function jardinera(x, y, z, largo){ caja(largo, .45, .45, MAT.grafito, x, y + .23, z); for (let i = 0; i < largo*3; i++) hojaEn(x - largo/2 + Math.random()*largo, y + .55 + Math.random()*.35, z + (Math.random()-.5)*.3, .18 + Math.random()*.1); }

// --------- Edificio: losas, fachada, iluminación indirecta ---------
YS.forEach((y, i) => {
  caja(W, .4, D, MAT.concretoOsc, 0, y - .2, 0);
  caja(W, .02, D, i === 1 ? S('#6e6a63', {roughness:.25}) : MAT.concreto, 0, y + .01, 0);
  caja(W, H, .3, S('#17191a'), 0, y + H/2, -D/2 - .15);
  for (let x = -W/2 + .2; x < W/2; x += .26) caja(.11, H - .5, .06, MAT.nogal, x, y + H/2 + .05, -D/2 + .03, scene, false);
  caja(W, .05, .05, LED, 0, y + H - .32, -D/2 + .12, scene, false);
  caja(W + .5, .32, .4, MAT.grafito, 0, y + H - .02, D/2 + .05);
  caja(W + .5, .035, .06, LED, 0, y + H - .2, D/2 + .27, scene, false);
  for (let k = -4; k <= 4; k++) caja(2.6, .04, .12, E('#fff3dc'), k*3.3, y + H - .19, 0, scene, false);
  const l1 = new THREE.PointLight('#ffd6a0', .85, 15, 2); l1.position.set(-8, y + H - .7, 1.5); scene.add(l1);
  const l2 = l1.clone(); l2.position.set(8, y + H - .7, 1.5); scene.add(l2);
  if (i > 0){ caja(W - 1, 1.05, .04, MAT.vidrio, 0, y + .55, D/2 - .2, scene, false); caja(W - 1, .05, .07, MAT.oro, 0, y + 1.08, D/2 - .2); jardinera(-10, y, D/2 - .6, 4); jardinera(10, y, D/2 - .6, 4); }
});
caja(W + 1, .5, D + .6, MAT.grafito, 0, 3*H + .25, 0);
[-W/2, W/2].forEach(x => { caja(.7, 3*H + .5, .7, MAT.grafito, x, 3*H/2, D/2 - .1); caja(.05, 3*H, .05, LED, x + (x < 0 ? .37 : -.37), 3*H/2, D/2 + .26, scene, false); });
[-W/2 - .9, W/2 + .9].forEach(x => { caja(1.2, 3*H + .4, D, S('#1d3a1d'), x, 3*H/2, 0); for (let i = 0; i < 170; i++) hojaEn(x + (x < 0 ? .6 : -.6), .3 + Math.random()*(3*H), -D/2 + Math.random()*D, .2 + Math.random()*.14); });
function texto(c, txt, x, y, font, color, glow){ const g = c.getContext('2d'); g.font = font; g.fillStyle = color; g.textAlign = 'center'; if (glow){ g.shadowColor = glow; g.shadowBlur = 26; } g.fillText(txt, x, y); g.shadowBlur = 0; }
function corona(g, cx, cy, s, color){ g.strokeStyle = color; g.lineWidth = 9*s; g.lineJoin = 'round'; g.fillStyle = 'rgba(233,184,79,.12)'; g.beginPath();
  g.moveTo(cx - 90*s, cy + 60*s); g.lineTo(cx - 75*s, cy - 50*s); g.lineTo(cx - 30*s, cy + 5*s); g.lineTo(cx, cy - 70*s); g.lineTo(cx + 30*s, cy + 5*s); g.lineTo(cx + 75*s, cy - 50*s); g.lineTo(cx + 90*s, cy + 60*s); g.closePath(); g.fill(); g.stroke();
  [[-75,-50],[0,-70],[75,-50]].forEach(([a, b]) => { g.beginPath(); g.arc(cx + a*s, cy + (b - 12)*s, 10*s, 0, 7); g.fillStyle = color; g.fill(); }); }
function lienzo(w, h, pintar){ const c = document.createElement('canvas'); c.width = w; c.height = h; pintar(c.getContext('2d'), c); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
function redondo(g, x, y, w, h, r){ g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
{ const t = lienzo(2048, 300, (g, c) => { g.shadowColor = '#e9b84f'; g.shadowBlur = 22; corona(g, 330, 150, 1.25, '#e9b84f'); g.shadowBlur = 0;
    texto(c, 'COMERCIALIZADORA', 1000, 120, '800 108px "Bricolage Grotesque", sans-serif', '#ffffff', '#e9b84f');
    texto(c, 'DEL REY', 1000, 255, '800 150px "Bricolage Grotesque", sans-serif', '#f3c45a', '#e9b84f');
    g.strokeStyle = '#8be05a'; g.lineWidth = 8; g.shadowColor = '#8be05a'; g.shadowBlur = 18; redondo(g, 1520, 95, 440, 120, 60); g.stroke(); g.shadowBlur = 0;
    texto(c, 'Oficina IA', 1740, 177, '700 72px "IBM Plex Sans", sans-serif', '#ffffff'); });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(19, 2.8), new THREE.MeshBasicMaterial({map:t, transparent:true})); m.position.set(0, 3*H + 2.0, D/2 - .4); scene.add(m);
  caja(20, 3.2, .3, S('#141516'), 0, 3*H + 2.0, D/2 - .62); }
caja(160, .1, 160, S('#121413', {roughness:.9}), 0, -.46, 0, scene, false);
caja(W + 12, .3, 9, S('#4a4b4a', {roughness:.22, metalness:.1}), 0, -.35, D/2 + 4.5);
for (let x = -W/2 - 4; x <= W/2 + 4; x += 3) caja(.04, .02, 9, S('#5c5d5c'), x, -.19, D/2 + 4.5, scene, false);
[-W/2 - 3, W/2 + 3].forEach(x => { planta(x, -.2, D/2 + 2, 1.8); planta(x, -.2, D/2 + 6, 1.6); });
[-10, 0, 10].forEach(x => { caja(.08, 3.5, .08, MAT.negro, x, 1.5, D/2 + 8.2); caja(.5, .05, .25, E('#ffd99a'), x, 3.25, D/2 + 8.2, scene, false);
  const l = new THREE.PointLight('#ffcc88', .6, 9, 2); l.position.set(x, 3, D/2 + 8); scene.add(l); });

// --------- Ciudad de lujo alrededor: torres con ventanas encendidas, avenida con carros, palmeras y alumbrado ---------
const MATS_TORRE = ['#0f1720', '#141a1f', '#10161c', '#1a1712'].map((fondo, i) => {
  const t = lienzo(256, 512, g => { g.fillStyle = fondo; g.fillRect(0, 0, 256, 512);
    for (let y = 6; y < 512; y += 21) for (let x = 6; x < 256; x += 19){ const r = Math.random();
      g.fillStyle = r < .34 ? (r < .1 ? '#ffe6b0' : '#f0c27a') : r < .46 ? '#4b6b82' : '#1b242b'; g.fillRect(x, y, 13, 14); } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 + i % 2, 2);
  return new THREE.MeshStandardMaterial({map:t, emissiveMap:t, emissive:new THREE.Color('#ffffff'), emissiveIntensity:.5, roughness:.3, metalness:.45}); });
for (let gx = -63; gx <= 63; gx += 9) for (let gz = -63; gz <= 36; gz += 9){
  if (Math.abs(gx) < 26 && gz > -16) continue;               // la sede y su plaza
  if (Math.abs(gx) < 34 && gz > 12) continue;                // vista libre desde la avenida
  if (gz > 12 && gz < 28) continue;                          // avenida
  if (Math.random() < .18) continue;                         // parques entre torres
  const lejos = Math.min(1, Math.hypot(gx, gz)/70), alto = 12 + Math.random()*22 + lejos*26, w = 5 + Math.random()*2.6, d = 5 + Math.random()*2.6;
  const x = gx + (Math.random()-.5)*1.6, z = gz + (Math.random()-.5)*1.6;
  const m = new THREE.Mesh(GEO_CAJA, MATS_TORRE[(Math.random()*4)|0]); m.scale.set(w, alto, d); m.position.set(x, alto/2 - .4, z); scene.add(m);
  if (Math.random() < .45){ caja(w + .1, .12, .12, LED, x, alto - .4, z + d/2, scene, false); caja(w*.6, 1.2, d*.6, MAT.grafito, x, alto + .2, z, scene, false); }
  if (Math.random() < .15) caja(.15, 6, .15, E('#ff5b4a'), x, alto + 3, z, scene, false);
}
const ZA = D/2 + 12.5;                                        // eje de la avenida

      <div class="sec">Incidencias de hoy</div>${(I.incidencias || []).length ? I.incidencias.map(x => `<div class="item">${esc(x.fecha)} · ${esc(x.detalle)}</div>`).join('') : '<div class="item">Sin incidencias.</div>'}
      <div class="sec">Acciones correctivas</div>${(I.acciones || []).map(x => `<div class="item"><span class="mono">${esc(x.id)}</span> ${esc(x.titulo)} · <b>${esc(corto(x.responsable))}</b> · ${esc(x.fecha)}</div>`).join('')}
      <div class="sec">Control documental</div>${(I.documentos || []).map(x => `<div class="item">${esc(x)}</div>`).join('')}`;
  }
}

// ================= MODOS DE CÁMARA =================
let modo = 'edificio', pisoSel = 1, seguido = null; const destinoCam = {pos:new THREE.Vector3(), tgt:new THREE.Vector3(), activo:false};
function ver(m, arg){
  modo = m; ['edificio','piso','seguir','pantallas'].forEach(x => $('m_' + x).setAttribute('aria-pressed', x === m));
  document.querySelectorAll('.pisos button').forEach(b => b.setAttribute('aria-pressed', m === 'piso' && +b.dataset.piso === pisoSel));
  const movil = innerWidth < 700;
  const corte = m === 'piso' ? (arg ?? pisoSel) : m === 'pantallas' || m === 'tele' ? 1 : m === 'seguir' ? (gente[arg || sel] || {}).piso : null;
  if (m === 'edificio'){ destinoCam.pos.set(-6, 9, movil ? 64 : 44); destinoCam.tgt.set(0, 6.6, 0); }
  if (m === 'piso'){ pisoSel = arg ?? pisoSel; const y = YS[pisoSel]; destinoCam.pos.set(-1.5, y + 10.5, movil ? 40 : 25); destinoCam.tgt.set(0, y + .6, -.8);
    document.querySelectorAll('.pisos button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.piso === pisoSel)); }
  if (m === 'seguir'){ seguido = arg || sel; sel = seguido; tab = 'agente'; pintar(); }
  if (m === 'pantallas'){ ladoTV = arg; const x = ladoTV * 10; destinoCam.pos.set(x, y2 + 2.05, movil ? -.4 : -1.5); destinoCam.tgt.set(x, y2 + 2.1, -5.9); }
  if (m === 'tele'){ modo = 'pantallas'; $('m_pantallas').setAttribute('aria-pressed', true); destinoCam.pos.set(arg.x, arg.y, arg.z + 5.1); destinoCam.tgt.set(arg.x, arg.y, arg.z); }
  destinoCam.activo = m !== 'seguir';
  modoTV = modo === 'pantallas'; ETIQUETAS.forEach(s => { if (modoTV) s.visible = false; else if (s.parent !== scene) s.visible = true; });
  cortar(corte); if (modoTV) ETIQUETAS.forEach(s => s.visible = false);
}
let ladoTV = 1, PARTES = null;
// Muestra solo un piso (n) como maqueta abierta: oculta los pisos de arriba y de abajo, la cubierta y el letrero; la ciudad queda.
function cortar(n){
  if (!PARTES) PARTES = scene.children.filter(o => !o.isLight).map(o => {
    if (o.userData.piso !== undefined) return {o, f:o.userData.piso};
    const p = o.position, sc = o.scale || {x:1, y:1};
    if (sc.x > 60 || esCiudad(p.x, p.z)) return {o, f:'c'};
    if (o.isMesh && sc.y > H + .5) return {o, f:'alto'};
    return {o, f:pisoDeY(p.y)}; });
  PARTES.forEach(({o, f}) => o.visible = n == null || f === 'c' || f === n);
}
$('m_edificio').onclick = () => ver('edificio'); $('m_piso').onclick = () => ver('piso', pisoSel); $('m_seguir').onclick = () => ver('seguir', sel);
$('m_pantallas').onclick = () => ver('pantallas', modo === 'pantallas' ? -ladoTV : -1);
document.querySelectorAll('.pisos button').forEach(b => b.onclick = () => ver('piso', +b.dataset.piso));
controls.addEventListener('start', () => { destinoCam.activo = false; });
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let abajo = null;
canvas.addEventListener('pointerdown', e => abajo = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => { if (!abajo || Math.hypot(e.clientX-abajo[0], e.clientY-abajo[1]) > 6) return;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse, camera);
  const tv = ray.intersectObjects(teles.map(t => t.m))[0], hit = ray.intersectObjects(clicables)[0];
  if (tv && (!hit || tv.distance < hit.distance)){ const t = teles.find(t => t.m === tv.object); ver('tele', {x:t.x, y:t.y, z:t.z}); return; }
  if (hit){ sel = hit.object.userData.cargo; tab = 'agente'; pintar(); } });
function tam(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', () => { tam(); if (modo === 'pantallas') ver('pantallas', ladoTV); else if (modo !== 'seguir') ver(modo, pisoSel); }); tam();
const clock = new THREE.Clock();
ver('edificio'); camera.position.copy(destinoCam.pos); controls.target.copy(destinoCam.tgt); pintar();

// ================= BUCLE =================
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
function sentar(g, t){ const u = g.r.userData; g.r.position.set(g.casa.x, g.casa.y - .05, g.casa.z); g.r.rotation.y = g.casa.rot;
  u.pi.rotation.x = u.pd.rotation.x = -Math.PI/2; const tecla = quieto ? 0 : Math.sin(t*9 + g.fase)*.08; u.bi.rotation.x = -1.2 + tecla; u.bd.rotation.x = -1.2 - tecla;
  if (!quieto) u.cabeza.rotation.y = Math.sin(t*.4 + g.fase)*.12; }
function caminar(g, q, t){ const u = g.r.userData; g.r.position.set(q.x, g.casa.y, q.z); g.r.rotation.y = q.dir;
  const p = Math.sin(t*8)*.55; u.pi.rotation.x = p; u.pd.rotation.x = -p; u.bi.rotation.x = -p*.7; u.bd.rotation.x = p*.7; }
const vTmp = new THREE.Vector3(), vTmp2 = new THREE.Vector3(); let tPrev = 0;
(function animar(){
  requestAnimationFrame(animar);
  const t = clock.getElapsedTime(), dt = Math.min(.1, t - tPrev); tPrev = t;
  if (!quieto){ autos.forEach(a => { a.g.position.x += a.v*dt; if (a.g.position.x > 105) a.g.position.x = -105; if (a.g.position.x < -105) a.g.position.x = 105; }); }
  if (!quieto && t > proximo){ siguienteEvento(t); proximo = t + 2.4; }
  pasoReunion(t);
  Object.values(gente).forEach(g => {
    const a = g.accion, on = g.c.funciones.some(trabaja);
    g.pant.color.set(g.obra ? '#3a3320' : (a && a.tipo === 'trabajo') || on ? '#8be05a' : g.c.color);
    if (!a){ sentar(g, t); return; }
    if (a.tipo === 'trabajo'){ sentar(g, t*2.6); if (Math.sin(t*14) > .6) g.pant.color.set('#ffffff'); if (t - a.ini > 2.6){ g.accion = null; quitarBurbuja(g); } return; }
    if (a.tipo === 'ir' || a.tipo === 'volver'){ const d = (t - a.ini)*2.4, q = punto(a.pts, Math.min(d, a.L)); caminar(g, q, t);
      if (d >= a.L){ if (a.tipo === 'volver'){ g.accion = null; quitarBurbuja(g); } else if (a.rol === 'reunion'){ a.tipo = 'reunido'; } else { a.tipo = 'charla'; a.ini = t; } } return; }
    if (a.tipo === 'reunido'){ const u = g.r.userData; g.r.position.set(a.asiento.x, g.casa.y - .05, a.asiento.z); g.r.rotation.y = a.asiento.rot;
      u.pi.rotation.x = u.pd.rotation.x = -Math.PI/2; u.bi.rotation.x = u.bd.rotation.x = -.9; return; }
    if (a.tipo === 'charla'){ const u = g.r.userData; u.pi.rotation.x = u.pd.rotation.x = 0; g.r.rotation.y = a.rol === 'lleva' ? Math.PI/2 : -Math.PI/2;
      u.bd.rotation.x = a.rol === 'lleva' ? -1 + Math.sin(t*4)*.15 : -.3; u.bi.rotation.x = 0; u.cabeza.rotation.y = Math.sin(t*2 + g.fase)*.2;
      if (a.rol === 'recibe' && !a.respondio && t - a.ini > 1.1){ a.respondio = true; responder(g, a.e); }
      if (t - a.ini > 3.4){ const pts = [...a.pts].reverse(); g.accion = {tipo:'volver', ini:t, pts, L:largo(pts)}; if (a.rol === 'lleva') quitarBurbuja(g); } }
  });
  if (modo === 'seguir' && seguido && gente[seguido]){ const p = gente[seguido].r.position; controls.target.lerp(vTmp.set(p.x, p.y + 1.2, p.z), 1 - Math.exp(-dt*5));
    camera.position.lerp(vTmp2.set(p.x - 2.5, p.y + 3.6, p.z + 7.5), 1 - Math.exp(-dt*3)); }
  else if (destinoCam.activo){ const k = 1 - Math.exp(-dt*3.2); camera.position.lerp(destinoCam.pos, k); controls.target.lerp(destinoCam.tgt, k); if (camera.position.distanceTo(destinoCam.pos) < .05) destinoCam.activo = false; }
  controls.update(); renderer.render(scene, camera);
})();
