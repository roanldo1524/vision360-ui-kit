<title>Comercializadora del Rey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Sede de 3 pisos en corte frontal, de noche, a pantalla completa. Paneles de vidrio oscuro con borde verde:
   marca arriba-izquierda, KPI arriba-derecha, ficha de la persona a la derecha, «lo que pasa ahora» abajo. Tema oscuro fijo. */
:root{
  --noche:#0d0f0e; --vidrio:rgba(14,20,17,.84); --borde:rgba(140,230,90,.35);
  --texto:#eef4ef; --suave:#a7b6ad; --verde:#8de04a; --oro:#f2c14e; --alerta:#ff7a59;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --cuerpo:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--noche);color:var(--texto);font-family:var(--cuerpo);overflow:hidden}
#escena{position:fixed;inset:0}
.vidrio{position:fixed;background:var(--vidrio);border:1px solid var(--borde);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 22px rgba(141,224,74,.12)}
#marca{top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));padding:12px 16px}
#marca h1{margin:0;font-family:var(--display);font-size:19px}
#marca p{margin:3px 0 0;font-size:12px;color:var(--suave)}
#kpi{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));padding:10px 14px;display:grid;grid-template-columns:repeat(5,auto);gap:2px 16px}
#kpi small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
#kpi b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
#ficha{top:calc(84px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 320px);overflow:auto;padding:14px}
#ficha .area{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--oro)}
#ficha h3{margin:4px 0 0;font-family:var(--display);font-size:20px}
#ficha .cargo{font-size:13px;color:var(--suave);margin:2px 0 8px}
#ficha p{font-size:13px;line-height:1.45;margin:0 0 8px}
.fun{border-top:1px dashed rgba(255,255,255,.14);padding-top:6px;margin-top:6px;font-size:12px;color:var(--suave);line-height:1.4}
.fun b{color:var(--texto)}
.fun .dato{font-family:var(--mono);color:var(--oro);margin-top:2px}
.pill{float:right;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--suave)}
.pill.on{background:rgba(141,224,74,.18);color:var(--verde)}
#flujo{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:360px;padding:10px 12px;max-height:200px;overflow:hidden}
#flujo h2,#ficha h2{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);font-weight:600}
#flujo ol{list-style:none;margin:0;padding:0;display:grid;gap:5px}
#flujo li{font-size:12.5px;line-height:1.35}
#flujo li span{color:var(--suave)}
#ayuda{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(14px,env(safe-area-inset-right,0px));padding:8px 12px;font-size:12px;color:var(--suave)}
@media (max-width:820px){
  #kpi{grid-template-columns:repeat(2,auto)}
  #ficha{top:auto;bottom:calc(190px + env(safe-area-inset-bottom,0px));left:max(14px,env(safe-area-inset-left,0px));width:auto;max-height:26%}
  #flujo{width:auto;right:max(14px,env(safe-area-inset-right,0px));max-height:150px}
  #ayuda{display:none}
  #marca p{display:none}
}
</style>

<canvas id="escena" aria-label="Sede de Comercializadora del Rey en 3D con el equipo trabajando"></canvas>
<header id="marca" class="vidrio"><h1>Comercializadora del Rey</h1><p>Oficina IA · datos de las <span id="act"></span></p></header>
<section id="kpi" class="vidrio" aria-label="KPI">
  <div><small>Vendido hoy</small><b id="vendido"></b></div>
  <div><small>Entrega · meta 90</small><b id="k_ent"></b></div>
  <div><small>Devolución · meta 3</small><b id="k_dev"></b></div>
  <div><small>Cancelación · meta 7</small><b id="k_can"></b></div>
  <div><small>Equipo al día</small><b id="k_sal"></b></div>
</section>
<aside id="ficha" class="vidrio" aria-live="polite"></aside>
<section id="flujo" class="vidrio" aria-live="polite"><h2>Lo que pasa ahora</h2><ol id="lista"></ol></section>
<div id="ayuda" class="vidrio">Toca a una persona · arrastra para girar · rueda o pellizco para acercar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATOS = /*DATOS*/null || {pisos:[]};
const $ = id => document.getElementById(id);
const pesos = n => '$' + Math.round(n||0).toLocaleString('es-CO');
$('act').textContent = DATOS.actualizado || '';
$('vendido').textContent = pesos(DATOS.vendido);
const K = DATOS.kpi || {};
[['k_ent', K.entrega, v => v >= 90], ['k_dev', K.devolucion, v => v <= 3], ['k_can', K.cancelacion, v => v <= 7]].forEach(([id, v, ok]) => {
  const el = $(id); el.textContent = v == null ? '—' : v + ' %'; if (v != null) el.style.color = ok(v) ? 'var(--verde)' : 'var(--alerta)'; });
{ const sa = DATOS.salud || {}, el = $('k_sal'); el.textContent = sa.revisados ? `${sa.ok}/${sa.revisados}` : '—';
  el.title = (sa.fallas || []).map(f => f.agente).join(', ') || 'todo en orden'; el.style.color = (sa.fallas || []).length ? 'var(--alerta)' : 'var(--verde)'; }
function bogota(){ const d = new Date(Date.now() - 5*3600e3); return {h:d.getUTCHours(), m:d.getUTCMinutes()}; }
function trabaja(a){ const {h,m} = bogota(); return a.horas.includes(h) && a.min.some(x => m >= x && m < x + 12); }
function proxima(a){ const {h,m} = bogota(); if (!a.horas.length) return null;
  for (let add = 1; add < 1440; add++){ const t = h*60 + m + add, hh = Math.floor(t/60) % 24, mm = t % 60;
    if (a.horas.includes(hh) && a.min.includes(mm)) return `${(hh%12)||12}:${String(mm).padStart(2,'0')} ${hh<12?'a. m.':'p. m.'}`; } return null; }
const todos = {}; (DATOS.pisos || []).forEach(p => p.agentes.forEach(c => todos[c.nombre] = c));

// ---------- Escena ----------
const canvas = $('escena');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .78;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0b0d0c'); scene.fog = new THREE.Fog('#0b0d0c', 55, 110);
const camera = new THREE.PerspectiveCamera(38, 1, .1, 300);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minDistance = 8; controls.maxDistance = 60; controls.maxPolarAngle = Math.PI*.55;
controls.minAzimuthAngle = -Math.PI*.38; controls.maxAzimuthAngle = Math.PI*.38;
scene.add(new THREE.HemisphereLight('#ffd9a8', '#141814', .32));
const luna = new THREE.DirectionalLight('#ffe2b8', .35); luna.position.set(-6, 14, 18); scene.add(luna);

const S = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.75, metalness:0}, o));
const E = c => new THREE.MeshBasicMaterial({color:c});
const caja = (w, h, d, mat, x, y, z, padre = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); padre.add(m); return m; };
const W = 24, D = 10, H = 3.8, PISOS_Y = [0, H, 2*H];
const piedra = S('#4b4d4f', {roughness:.5}), grafito = S('#1c1e20', {roughness:.6, metalness:.3}), roble = S('#b07a48', {roughness:.6}),
      blanco = S('#eeeae2', {roughness:.5}), hoja = S('#3f8f3a'), hoja2 = S('#2f6e2d'), carton = S('#c99a62'), azulMetal = S('#2d4f8f', {metalness:.4, roughness:.4}),
      vidrio = new THREE.MeshStandardMaterial({color:'#bfe3ea', transparent:true, opacity:.16, roughness:.05, metalness:.2, depthWrite:false});

// Estructura: losas, paredes de fondo con listones de roble, luces lineales LED y barandas de vidrio
PISOS_Y.forEach((y, i) => {
  caja(W, .35, D, i ? grafito : S('#2a2c2e'), 0, y - .175, 0);
  caja(W, .02, D, i === 0 ? S('#6f7174', {roughness:.25, metalness:.1}) : S('#3a3c3f', {roughness:.35}), 0, y + .01, 0);
  caja(W, H, .3, S('#191b1c'), 0, y + H/2, -D/2 - .15);
  for (let x = -W/2 + .3; x < W/2; x += .22) if (Math.abs(x) > 3.8 || i === 1 ? Math.abs(x) > 3.6 : true) caja(.09, H - .4, .06, roble, x, y + H/2, -D/2 + .02);
  caja(W + .4, .25, .3, grafito, 0, y + H - .05, D/2);                        // canto frontal de la losa superior
  caja(W, .04, .06, E('#ffcf8a'), 0, y + H - .19, D/2 + .14);                 // luz del canto
  for (let k = -3; k <= 3; k++) caja(2.6, .05, .14, E('#fff1d6'), k*3.3, y + H - .08, -1.5);   // perfiles LED en el techo
  const l = new THREE.PointLight('#ffd9a8', i === 0 ? 1.1 : 1.0, 16, 2); l.position.set(-5, y + H - .6, 1); scene.add(l);
  const l2 = l.clone(); l2.position.set(6, y + H - .6, 1); scene.add(l2);
  if (i > 0){ caja(W - 6, 1.05, .04, vidrio, 3, y + .55, D/2 - .1); caja(W - 6, .05, .08, S('#c8c8c8', {metalness:.8, roughness:.2}), 3, y + 1.08, D/2 - .1);
    caja(W - 6, .03, .03, E('#9df05a'), 3, y + .04, D/2 - .08); }
});
caja(W + .4, .35, D, grafito, 0, 3*H + .17, 0);                                    // techo
caja(W + 6, .3, 6, S('#232527', {roughness:.4}), 0, -.36, D/2 + 3);                // andén frontal
// ---------- Exterior: andén, calle, faroles, árboles, carros, aletas de fachada, terraza y ciudad de noche ----------
caja(160, .1, 160, S('#151716'), 0, -.56, 0);                                                  // terreno
caja(80, .06, 8, S('#26282b', {roughness:.6}), 0, -.5, D/2 + 10);                               // calle
for (let x = -38; x < 40; x += 4) caja(2, .02, .14, E('#d9d2bf'), x, -.46, D/2 + 10);          // líneas de la calle
caja(80, .25, 2.2, S('#3a3c3f', {roughness:.5}), 0, -.4, D/2 + 15.1);                          // andén del frente
function farol(x, z){ caja(.08, 4.2, .08, S('#1a1a1a', {metalness:.6}), x, 1.6, z); caja(.9, .06, .08, S('#1a1a1a'), x + .4, 3.7, z);
  caja(.3, .06, .2, E('#ffd79a'), x + .8, 3.64, z); const l = new THREE.PointLight('#ffc98a', .7, 9, 2); l.position.set(x + .8, 3.4, z); scene.add(l); }
[-13, -4.5, 4.5, 13].forEach(x => farol(x, D/2 + 5.6));
function arbol(x, z, s = 1){ caja(1.2*s, .5, 1.2*s, S('#4a4c4f'), x, -.1, z); caja(.14*s, 2.2*s, .14*s, S('#4a3426'), x, 1*s, z);
  for (let i = 0; i < 6; i++){ const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.75*s, 0), i % 2 ? hoja : hoja2); f.position.set(x + (Math.random()-.5)*1.1*s, (2.4 + Math.random()*.9)*s, z + (Math.random()-.5)*1.1*s); scene.add(f); } }
[-20, -16, 16, 20].forEach(x => arbol(x, D/2 + 6.5, 1));
function carro(x, z, color){ const g = new THREE.Group(); caja(4, .7, 1.8, S(color, {metalness:.6, roughness:.35}), 0, .55, 0, g);
  caja(2.2, .55, 1.6, S('#1b2530', {metalness:.4, roughness:.1}), -.2, 1.15, 0, g);
  [[-1.3,.9],[1.3,.9],[-1.3,-.9],[1.3,-.9]].forEach(([a, b]) => { const r = new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.25,14), S('#111')); r.rotation.x = Math.PI/2; r.position.set(a, .33, b); g.add(r); });
  caja(.05, .16, .4, E('#fff4d0'), 2.01, .62, .55, g); caja(.05, .16, .4, E('#fff4d0'), 2.01, .62, -.55, g);
  g.position.set(x, -.5, z); scene.add(g); }
carro(-17, D/2 + 9.4, '#8c1d22'); carro(17, D/2 + 9.4, '#d9dadb');
for (let i = 0; i < 14; i++) caja(.18, 3*H + .4, .5, S('#2c2f33', {metalness:.7, roughness:.3}), W/2 + .15, 3*H/2, -D/2 + .4 + i*.72);   // aletas de aluminio en el costado
caja(.05, 3*H, D, S('#141a1c', {metalness:.3, roughness:.1, transparent:true, opacity:.8}), W/2 + .02, 3*H/2, 0);
// terraza verde y letrero luminoso en la cubierta
caja(W - 2, .45, 2, S('#d9d5cc'), 0, 3*H + .55, -D/2 + 1.2);
for (let i = 0; i < 30; i++){ const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.3 + Math.random()*.2, 0), i % 2 ? hoja : hoja2); f.position.set(-W/2 + 1.5 + i*.72, 3*H + 1.05, -D/2 + 1.2 + (Math.random()-.5)*.6); scene.add(f); }
{ const c = document.createElement('canvas'); c.width = 1600; c.height = 200; const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.shadowColor = '#a6f05a'; x.shadowBlur = 30; x.font = '800 118px "Bricolage Grotesque", sans-serif'; x.textAlign = 'center'; x.fillText('♛ COMERCIALIZADORA DEL REY', 800, 145);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const rotRoof = new THREE.Mesh(new THREE.PlaneGeometry(11, 1.4), new THREE.MeshBasicMaterial({map:t, transparent:true})); rotRoof.position.set(0, 3*H + 1.9, D/2 - .5); scene.add(rotRoof);
  caja(11.2, .08, .08, S('#222'), 0, 3*H + 1.1, D/2 - .52); }
// ciudad de noche al fondo
{ const c = document.createElement('canvas'); c.width = 64; c.height = 128; const x = c.getContext('2d'); x.fillStyle = '#121518'; x.fillRect(0, 0, 64, 128);
  for (let r = 0; r < 16; r++) for (let k = 0; k < 4; k++){ x.fillStyle = Math.random() < .35 ? '#f3c97a' : '#1f262b'; x.fillRect(4 + k*15, 4 + r*8, 9, 4); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  for (let i = 0; i < 26; i++){ const alto = 10 + Math.random()*26, w = 6 + Math.random()*8, tex = t.clone(); tex.needsUpdate = true; tex.repeat.set(Math.round(w/4), Math.round(alto/6));
    const e = new THREE.Mesh(new THREE.BoxGeometry(w, alto, 6), new THREE.MeshBasicMaterial({map:tex, color:'#6c7378'}));
    e.position.set(-75 + i*6 + Math.random()*2, alto/2 - .5, -55 - Math.random()*20); scene.add(e); } }

// Muro verde con el letrero de la empresa (lado izquierdo, toda la altura)
const muro = new THREE.Group(); muro.position.set(-W/2 - 1.6, 0, 1); scene.add(muro);
caja(3.2, 3*H, .5, S('#1f3a1f'), 0, 3*H/2, 0, muro);
for (let i = 0; i < 260; i++){ const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.12 + Math.random()*.16, 0), Math.random() < .5 ? hoja : hoja2);
  const fy = .3 + Math.random()*(3*H - .6); if (fy > 3*H - 7.3 && fy < 3*H - 1.1 && i % 5) continue; f.position.set(-1.5 + Math.random()*3, fy, .28 + Math.random()*.1); muro.add(f); }
function texLetrero(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 1024; const x = c.getContext('2d');
  x.clearRect(0, 0, 512, 1024);
  // corona
  x.strokeStyle = '#a6f05a'; x.fillStyle = 'rgba(166,240,90,.15)'; x.lineWidth = 14; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(110, 300); x.lineTo(130, 150); x.lineTo(200, 230); x.lineTo(256, 120); x.lineTo(312, 230); x.lineTo(382, 150); x.lineTo(402, 300); x.closePath(); x.fill(); x.stroke();
  [[130,150],[256,120],[382,150]].forEach(([a, b]) => { x.beginPath(); x.arc(a, b - 10, 16, 0, Math.PI*2); x.fillStyle = '#a6f05a'; x.fill(); });
  x.fillStyle = '#ffffff'; x.textAlign = 'center'; x.shadowColor = '#a6f05a'; x.shadowBlur = 24;
  x.font = '800 50px "Bricolage Grotesque", sans-serif'; x.fillText('COMERCIALIZADORA', 256, 400); x.font = '800 92px "Bricolage Grotesque", sans-serif'; x.fillText('DEL REY', 256, 495);
  x.shadowBlur = 0; x.strokeStyle = '#a6f05a'; x.lineWidth = 6; x.beginPath(); x.roundRect ? x.roundRect(96, 545, 320, 90, 45) : x.rect(96, 545, 320, 90); x.stroke();
  x.fillStyle = '#ffffff'; x.font = '700 54px "IBM Plex Sans", sans-serif'; x.fillText('Oficina IA', 256, 607);
  x.font = '500 40px "IBM Plex Sans", sans-serif'; x.fillStyle = '#e7f2e2'; ['Logística', 'Confirmación', 'Contenido', 'Tecnología'].forEach((t, i) => x.fillText(t, 256, 720 + i*58));
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const letrero = new THREE.Mesh(new THREE.PlaneGeometry(3, 6), new THREE.MeshBasicMaterial({map:texLetrero(), transparent:true}));
letrero.position.set(0, 3*H - 4.2, .75); muro.add(letrero);
const brilloMuro = new THREE.PointLight('#a6f05a', .9, 10, 2); brilloMuro.position.set(-W/2 - 1, 8, 4); scene.add(brilloMuro);

// Escalera iluminada del piso 1 al 2
for (let s = 0; s < 16; s++){ const y = (s + 1)*H/16, x = -W/2 + .9 + s*.38;
  caja(.38, .1, 1.6, S('#2b2d2f'), x, y - .05, 3.6); caja(.38, .02, .05, E('#ffcf8a'), x, y + .01, 4.42); }
caja(6.2, .04, .04, S('#c8c8c8', {metalness:.8, roughness:.2}), -W/2 + 3.9, 2.6, 4.45).rotation.z = Math.atan2(H, 6.1);
caja(6.2, 1, .03, vidrio, -W/2 + 3.9, 2.4, 4.45).rotation.z = Math.atan2(H, 6.1);

// Utilidades
function planta(x, y, z, s = 1){ const g = new THREE.Group(); caja(.5*s, .55*s, .5*s, S('#d9d5cc'), 0, .28*s, 0, g);
  for (let i = 0; i < 5; i++){ const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.32*s, 0), i % 2 ? hoja : hoja2); f.position.set((Math.random()-.5)*.4*s, (.8 + Math.random()*.6)*s, (Math.random()-.5)*.4*s); g.add(f); }
  g.position.set(x, y, z); scene.add(g); }
function cartel(texto, color, ancho = 420, alto = 72, oscuro = false){
  const c = document.createElement('canvas'); c.width = ancho; c.height = alto; const x = c.getContext('2d');
  x.fillStyle = oscuro ? 'rgba(14,22,17,.92)' : 'rgba(255,255,255,.95)'; x.beginPath(); x.roundRect ? x.roundRect(0, 0, ancho, alto, 18) : x.rect(0, 0, ancho, alto); x.fill();
  if (oscuro){ x.strokeStyle = '#9df05a'; x.lineWidth = 4; x.stroke(); } else { x.fillStyle = color; x.fillRect(0, 0, 10, alto); }
  x.fillStyle = oscuro ? '#ffffff' : '#1d2420'; x.font = `600 ${Math.round(alto*.42)}px "IBM Plex Sans", sans-serif`; x.textBaseline = 'middle'; x.fillText(texto, oscuro ? 26 : 24, alto/2 + 1);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false})); s.scale.set(ancho/220, alto/220, 1); s.renderOrder = 5; return s;
}
function silla(x, y, z, rot){ const g = new THREE.Group(), n = S('#151617'); caja(.5, .08, .5, n, 0, .48, 0, g); caja(.5, .6, .06, n, 0, .84, -.24, g);
  caja(.04, .42, .04, n, 0, .24, 0, g); caja(.55, .03, .55, n, 0, .03, 0, g); g.position.set(x, y, z); g.rotation.y = rot; scene.add(g); }
function escritorio(x, y, z, color, rot = 0, ancho = 1.4, pantallas = 2){ const g = new THREE.Group();
  caja(ancho, .05, .72, roble, 0, .74, 0, g); caja(.05, .72, .66, S('#1b1c1e', {metalness:.5}), -ancho/2 + .05, .37, 0, g); caja(.05, .72, .66, S('#1b1c1e', {metalness:.5}), ancho/2 - .05, .37, 0, g);
  caja(.38, .58, .55, blanco, ancho/2 - .3, .3, 0, g);
  let pan = null;
