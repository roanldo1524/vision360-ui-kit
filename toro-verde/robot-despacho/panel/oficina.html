<title>Oficina Toro Verde</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Salón de oficina en corte isométrico (como la referencia de Ronald) a pantalla completa; paneles claros encima:
   marca y KPI arriba, ficha de la persona a la derecha, «lo que pasa ahora» abajo a la izquierda. Tema claro fijo. */
:root{
  --fondo:#eef0ef; --vidrio:rgba(255,255,255,.88); --borde:rgba(30,40,35,.12);
  --texto:#1d2420; --suave:#5d6b63; --verde:#1f9d57; --oro:#a8781c; --alerta:#c4462b;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --cuerpo:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);overflow:hidden}
#escena{position:fixed;inset:0}
.vidrio{position:fixed;background:var(--vidrio);border:1px solid var(--borde);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.06)}
#marca{top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));padding:12px 16px}
#marca h1{margin:0;font-family:var(--display);font-size:19px}
#marca p{margin:3px 0 0;font-size:12px;color:var(--suave)}
#kpi{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));padding:10px 14px;display:grid;grid-template-columns:repeat(4,auto);gap:2px 16px}
#kpi small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
#kpi b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
#ficha{top:calc(84px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:310px;max-height:calc(100% - 300px);overflow:auto;padding:14px}
#ficha .area{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--oro)}
#ficha h3{margin:4px 0 0;font-family:var(--display);font-size:20px}
#ficha .cargo{font-size:13px;color:var(--suave);margin:2px 0 8px}
#ficha p{font-size:13px;line-height:1.45;margin:0 0 8px}
.fun{border-top:1px dashed var(--borde);padding-top:6px;margin-top:6px;font-size:12px;color:var(--suave);line-height:1.4}
.fun b{color:var(--texto)}
.fun .dato{font-family:var(--mono);color:var(--oro);margin-top:2px}
.pill{float:right;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.06);color:var(--suave)}
.pill.on{background:rgba(31,157,87,.15);color:var(--verde)}
#flujo{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:360px;padding:10px 12px;max-height:210px;overflow:hidden}
#flujo h2,#ficha h2{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);font-weight:600}
#flujo ol{list-style:none;margin:0;padding:0;display:grid;gap:5px}
#flujo li{font-size:12.5px;line-height:1.35}
#flujo li b{font-weight:600}
#flujo li span{color:var(--suave)}
#ayuda{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(14px,env(safe-area-inset-right,0px));padding:8px 12px;font-size:12px;color:var(--suave)}
@media (max-width:820px){
  #kpi{grid-template-columns:repeat(2,auto)}
  #ficha{top:auto;bottom:calc(240px + env(safe-area-inset-bottom,0px));left:max(14px,env(safe-area-inset-left,0px));width:auto;max-height:28%}
  #flujo{width:auto;right:max(14px,env(safe-area-inset-right,0px));max-height:150px}
  #ayuda{display:none}
  #marca p{display:none}
}
</style>

<canvas id="escena" aria-label="Oficina de Toro Verde en 3D con el equipo trabajando"></canvas>
<header id="marca" class="vidrio"><h1>Oficina Toro Verde</h1><p>Logística, atención y tecnología · datos de las <span id="act"></span></p></header>
<section id="kpi" class="vidrio" aria-label="KPI">
  <div><small>Vendido hoy</small><b id="vendido"></b></div>
  <div><small>Entrega · meta 90</small><b id="k_ent"></b></div>
  <div><small>Devolución · meta 3</small><b id="k_dev"></b></div>
  <div><small>Cancelación · meta 7</small><b id="k_can"></b></div>
</section>
<aside id="ficha" class="vidrio" aria-live="polite"></aside>
<section id="flujo" class="vidrio" aria-live="polite"><h2>Lo que pasa ahora en la oficina</h2><ol id="lista"></ol></section>
<div id="ayuda" class="vidrio">Toca a una persona para ver su cargo · arrastra para girar · rueda o pellizco para acercar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATOS = /*DATOS*/null || {pisos:[]};
const $ = id => document.getElementById(id);
const pesos = n => '$' + Math.round(n||0).toLocaleString('es-CO');
$('act').textContent = DATOS.actualizado || '';
$('vendido').textContent = pesos(DATOS.vendido);
const K = DATOS.kpi || {};
[['k_ent', K.entrega, v => v >= 90], ['k_dev', K.devolucion, v => v <= 3], ['k_can', K.cancelacion, v => v <= 7]].forEach(([id, v, ok]) => {
  const el = $(id); el.textContent = v == null ? '—' : v + ' %'; if (v != null) el.style.color = ok(v) ? 'var(--verde)' : 'var(--alerta)'; });

function bogota(){ const d = new Date(Date.now() - 5*3600e3); return {h:d.getUTCHours(), m:d.getUTCMinutes()}; }
function trabaja(a){ const {h,m} = bogota(); return a.horas.includes(h) && a.min.some(x => m >= x && m < x + 12); }
function proxima(a){ const {h,m} = bogota(); if (!a.horas.length) return null;
  for (let add = 1; add < 1440; add++){ const t = h*60 + m + add, hh = Math.floor(t/60) % 24, mm = t % 60;
    if (a.horas.includes(hh) && a.min.includes(mm)) return `${(hh%12)||12}:${String(mm).padStart(2,'0')} ${hh<12?'a. m.':'p. m.'}`; } return null; }

const oficina = (DATOS.pisos || []).find(p => p.tipo === 'oficina') || {agentes:[]};
const porNombre = {}; oficina.agentes.forEach(c => porNombre[c.nombre] = c);

// ---------- Escena: salón de 18 × 12 m en corte isométrico, diseñado por zonas (escala 1 u = 1 m) ----------
const canvas = $('escena');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#eef0ef');
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 200);
camera.position.set(24, 22, 24);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 0, 0); controls.enableDamping = true; controls.maxPolarAngle = Math.PI*.42; controls.minZoom = .6; controls.maxZoom = 3.5;
scene.add(new THREE.HemisphereLight('#ffffff', '#9c958a', .62));
const sol = new THREE.DirectionalLight('#fff1dc', .72); sol.position.set(12, 20, 9); sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, {left:-14, right:14, top:14, bottom:-14}); sol.shadow.bias = -.0005; scene.add(sol);

const M = c => new THREE.MeshLambertMaterial({color:c});
const caja = (w, h, d, mat, x, y, z, padre = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; padre.add(m); return m; };
const AN = 18, FO = 12, AL = 3;
const madera = M('#c4996b'), roble = M('#d8b78e'), cemento = M('#bdbbb5'), negro = M('#2a2c30'), blanco = M('#f4f3ef'), hoja = M('#4f8f4a'), hoja2 = M('#3f7a3c');
const vidrio = new THREE.MeshPhongMaterial({color:'#c3dde8', transparent:true, opacity:.26, shininess:120, depthWrite:false});

// Losa, pisos y paredes
caja(AN, .3, FO, M('#e7e4de'), 0, -.15, 0);
caja(AN, .02, FO, madera, 0, .01, 0);
caja(4.4, .025, 7.2, cemento, 6.8, .02, -2.4);                         // piso de la sala de tecnología
caja(AN, AL, .2, M('#2e3034'), 0, AL/2, -FO/2 - .1);                   // pared oscura del fondo
caja(.2, AL, FO, M('#ebe8e2'), -AN/2 - .1, AL/2, 0);                    // pared clara izquierda
for (let x = -8.8; x < 4.6; x += .18) caja(.08, AL - .2, .05, roble, x, AL/2, -FO/2 + .03);   // listones de roble (acústicos) en la pared del fondo
// muro verde con estación de café (pared izquierda)
caja(.12, 2.2, 4.2, M('#2f5d34'), -AN/2 + .07, 1.5, 3.4);
for (let i = 0; i < 60; i++){ const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.16 + Math.random()*.1, 0), Math.random() < .5 ? hoja : hoja2);
  f.position.set(-AN/2 + .18, .5 + Math.random()*2, 1.4 + Math.random()*4); scene.add(f); }
caja(.7, .95, 2.4, blanco, -AN/2 + .5, .48, 3.4); caja(.75, .05, 2.5, roble, -AN/2 + .5, .97, 3.4); caja(.25, .35, .25, negro, -AN/2 + .5, 1.17, 2.7);

// Utilidades de mobiliario
function planta(x, z, s = 1, padre = scene){ const g = new THREE.Group(); caja(.36*s, .42*s, .36*s, blanco, 0, .21*s, 0, g);
  const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.38*s, 0), hoja); f.position.y = .72*s; f.scale.y = 1.35; f.castShadow = true; g.add(f);
  g.position.set(x, 0, z); padre.add(g); }
function tapete(x, z, w, d, color){ caja(w, .012, d, M(color), x, .035, z); }
function cuadro(x, y, z, w, h, color, rotY = 0){ const g = new THREE.Group(); caja(w, h, .03, negro, 0, 0, 0, g); caja(w - .08, h - .08, .035, M(color), 0, 0, .005, g); g.position.set(x, y, z); g.rotation.y = rotY; scene.add(g); }
function lampara(x, z){ caja(.015, .9, .015, negro, x, AL - .45, z); const c = new THREE.Mesh(new THREE.ConeGeometry(.16, .22, 16, 1, true), negro); c.position.set(x, AL - 1, z); scene.add(c);
  const b = new THREE.Mesh(new THREE.SphereGeometry(.06, 10, 8), new THREE.MeshBasicMaterial({color:'#fff2c9'})); b.position.set(x, AL - 1.1, z); scene.add(b); }
function silla(x, z, rot){ const g = new THREE.Group(); caja(.5, .08, .5, negro, 0, .48, 0, g); caja(.5, .58, .06, negro, 0, .82, -.24, g);
  caja(.04, .42, .04, negro, 0, .24, 0, g); caja(.55, .03, .55, negro, 0, .03, 0, g); g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g); }
function escritorio(x, z, rot, color, ancho = 1.4){ const g = new THREE.Group();
  caja(ancho, .05, .7, roble, 0, .74, 0, g); caja(.04, .72, .64, negro, -ancho/2 + .05, .37, 0, g); caja(.04, .72, .64, negro, ancho/2 - .05, .37, 0, g);
  caja(.56, .34, .03, negro, 0, 1.0, .22, g); caja(.06, .12, .06, negro, 0, .81, .22, g);
  const pan = new THREE.Mesh(new THREE.PlaneGeometry(.52, .3), new THREE.MeshBasicMaterial({color})); pan.position.set(0, 1.0, .203); pan.rotation.y = Math.PI; g.add(pan);
  caja(.38, .02, .13, M('#3a3d42'), 0, .77, -.1, g); caja(.12, .14, .12, blanco, ancho/2 - .2, .84, .15, g);
  g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g); return {g, pan}; }
function cartel(texto, color, ancho = 420, alto = 72){
  const c = document.createElement('canvas'); c.width = ancho; c.height = alto; const x = c.getContext('2d');
  x.fillStyle = 'rgba(255,255,255,.95)'; x.beginPath(); x.roundRect ? x.roundRect(0, 0, ancho, alto, 18) : x.rect(0, 0, ancho, alto); x.fill();
  x.fillStyle = color; x.fillRect(0, 0, 10, alto);
  x.fillStyle = '#1d2420'; x.font = '600 30px "IBM Plex Sans", sans-serif'; x.textBaseline = 'middle'; x.fillText(texto, 24, alto/2 + 1);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false})); s.scale.set(ancho/220, alto/220, 1); s.renderOrder = 5; return s;
}

// ZONA 1 · Oficinitas de Logística: 5 cubículos de vidrio de 2,8 × 3 m contra el fondo
const POD_W = 2.8, POD_Z0 = -FO/2, POD_Z1 = -3, POD_X0 = -9;
const COLORES_TAPETE = ['#d9cbb4','#c9d6cf','#d6c6c9','#cfd3dd','#d8d0bd'];
const PODS = [];
for (let i = 0; i < 5; i++){
  const cx = POD_X0 + POD_W*i + POD_W/2;
  if (i > 0) caja(.05, 2.3, 3, vidrio, POD_X0 + POD_W*i, 1.15, (POD_Z0 + POD_Z1)/2);          // divisor de vidrio entre oficinitas
  caja(.75, 2.3, .05, vidrio, cx - 1.02, 1.15, POD_Z1); caja(.75, 2.3, .05, vidrio, cx + 1.02, 1.15, POD_Z1);   // frente de vidrio con puerta en el centro
  caja(POD_W, .06, .06, negro, cx, 2.3, POD_Z1); caja(.05, 2.3, .05, negro, cx - .62, 1.15, POD_Z1); caja(.05, 2.3, .05, negro, cx + .62, 1.15, POD_Z1);
  tapete(cx, -4.4, 2.1, 1.9, COLORES_TAPETE[i]);
  planta(cx + 1.05, -5.6, .9);
  cuadro(cx - .5, 1.9, -FO/2 + .08, .7, .5, ['#c26a3d','#3d7fb0','#5c8a4a','#b0893d','#7a5fa0'][i]);
  PODS.push({cx});
}
caja(4.2, .06, .06, negro, -9 + 14 + .1, 2.3, POD_Z1);
// ZONA 2 · Centro de mando: mesa de juntas y pantalla de KPI (líder)
tapete(-1.4, 1.4, 5.2, 3.2, '#d7d1c4');
caja(3.2, .06, 1.3, roble, -1.4, .74, 1.4); caja(.1, .7, .1, negro, -2.6, .37, 1.4); caja(.1, .7, .1, negro, -.2, .37, 1.4);
[-2.4, -1.4, -.4].forEach(x => { silla(x, .4, 0); silla(x, 2.4, Math.PI); });
caja(.1, 1.2, 2.2, negro, 1.1, 1.25, 1.4); const tvK = new THREE.Mesh(new THREE.PlaneGeometry(2.05, 1.05), new THREE.MeshBasicMaterial({color:'#123a26'})); tvK.position.set(1.04, 1.25, 1.4); tvK.rotation.y = -Math.PI/2; scene.add(tvK);
caja(.08, .6, .08, negro, 1.1, .3, 1.4);
lampara(-2, 1.4); lampara(-.8, 1.4);
// ZONA 3 · Sala de tecnología de vidrio con el núcleo de servidores (AI Core)
caja(4.4, 2.4, .05, vidrio, 6.8, 1.2, 1.2); caja(.05, 2.4, 2.6, vidrio, 4.6, 1.2, -1.5); caja(.05, 2.4, 2.8, vidrio, 4.6, 1.2, -4.5 + .1);
caja(4.4, .06, .06, negro, 6.8, 2.4, 1.2); caja(.06, .06, 7.2, negro, 4.6, 2.4, -2.4);
const rack = caja(1, 2.1, .8, negro, 8.4, 1.05, -5.3);
for (let y = .35; y < 2; y += .22){ const led = new THREE.Mesh(new THREE.BoxGeometry(.8, .03, .02), new THREE.MeshBasicMaterial({color: y % .44 < .22 ? '#35d0e0' : '#f2b43a'})); led.position.set(8.4, y, -4.89); scene.add(led); }
caja(1.3, 2.3, .04, vidrio, 8.4, 1.15, -4.7);
lampara(6.3, -2.7); lampara(6.3, -.9);
// ZONA 4 · Lounge para descansar y mostrar a clientes
tapete(6.4, 3.9, 4.6, 3.2, '#cfc6b8');
caja(3, .42, .9, M('#7d8a93'), 6.4, .3, 5.4); caja(3, .5, .2, M('#6f7c85'), 6.4, .7, 5.85); caja(.9, .42, 1.8, M('#7d8a93'), 4.6, .3, 4.9);
caja(1.4, .05, .7, roble, 6.4, .42, 3.6); caja(.06, .38, .06, negro, 6.4, .2, 3.6);
caja(.8, .45, .8, M('#3d8fd1'), 8.4, .32, 2.6);
caja(.35, 1.8, 2.2, roble, 8.85, .9, 4.4); for (let y = .45; y < 1.8; y += .45){ caja(.36, .03, 2.1, M('#b38d63'), 8.85, y, 4.4); for (let k = 0; k < 7; k++) caja(.22, .3, .12, M(['#c26a3d','#3d7fb0','#e8e2d4','#5c8a4a'][k % 4]), 8.8, y + .17, 3.6 + k*.25); }
planta(4.3, 2.4, 1.2); planta(8.6, 6.3 - .9, 1); planta(-8.4, 5.4, 1.2); planta(-4.3, 5.4, 1.1); planta(1.6, 5.5, 1.3); planta(-8.5, -2.4, 1);
// jardinera lineal frente a las oficinitas
caja(5, .45, .4, blanco, -5.5, .23, -2.3); for (let k = 0; k < 9; k++){ const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.22, 0), k % 2 ? hoja : hoja2); f.position.set(-7.7 + k*.55, .6, -2.3); scene.add(f); }

// ---------- Personas ----------
const PIEL = ['#f1c7a5','#d9a27c','#b97f5a','#8d5a3b'], PELO = ['#2b1d14','#4a3022','#1b1b1b','#7a5230'];
const MUJERES = /^(Daniela|Juliana|Valentina|Laura|Sara|Isabella|Mariana)/;
function persona(color, k, mujer){
  const g = new THREE.Group(), cam = M(color), pan = M('#2f3540'), piel = M(PIEL[k % 4]), pelo = M(PELO[(k+1) % 4]);
  const pierna = l => { const p = new THREE.Group(); caja(.17, .7, .19, pan, 0, -.35, 0, p); caja(.19, .08, .28, M('#1d1d1d'), 0, -.72, .05, p); p.position.set(l*.11, .75, 0); g.add(p); return p; };
  const brazo = l => { const p = new THREE.Group(); caja(.13, .55, .15, cam, 0, -.27, 0, p); caja(.11, .11, .11, piel, 0, -.58, 0, p); p.position.set(l*.29, 1.32, 0); g.add(p); return p; };
  const pi = pierna(-1), pd = pierna(1), bi = brazo(-1), bd = brazo(1);
  caja(mujer ? .4 : .46, .58, .26, cam, 0, 1.05, 0, g);
  const cabeza = new THREE.Mesh(new THREE.SphereGeometry(.17, 16, 12), piel); cabeza.position.y = 1.55; cabeza.castShadow = true; g.add(cabeza);
  const cab = new THREE.Mesh(new THREE.SphereGeometry(.18, 16, 12, 0, Math.PI*2, 0, Math.PI*.55), pelo); cab.position.y = 1.58; g.add(cab);
  if (mujer){ caja(.34, .42, .1, pelo, 0, 1.4, -.12, g); caja(.07, .32, .16, pelo, -.16, 1.45, -.02, g); caja(.07, .32, .16, pelo, .16, 1.45, -.02, g); }
  g.userData = {pi, pd, bi, bd, cabeza}; return g;
}

// Puestos: [x, z, hacia dónde mira, punto de puerta por donde sale y donde la visitan]
const P = i => PODS[i].cx;
const PUESTOS = {
  'Confirmador de pedidos':  [P(0), -4.9, 0, [P(0), -2.6]],
  'Resolutor de novedades':  [P(1), -4.9, 0, [P(1), -2.6]],
  'Gestor de tickets y CAS': [P(2), -4.9, 0, [P(2), -2.6]],
  'Abogado de devoluciones': [P(3), -4.9, 0, [P(3), -2.6]],
  'Rastreador de oficinas':  [P(4), -4.9, 0, [P(4), -2.6]],
  'Líder de Logística':      [-3.3, 1.4, Math.PI/2, [-3.6, 2.9]],
  'Líder de Tecnología':     [5.4, -4.2, Math.PI/2, [4.1, -3]],
  'Monitor de fallas':       [5.4, -2.4, Math.PI/2, [4.1, -3]],
  'Auditor de calidad':      [8.2, -2.4, -Math.PI/2, [4.1, -3]],
  'Optimizador de procesos': [8.2, -.6, -Math.PI/2, [4.1, -.2]],
  'Guardián de datos':       [7.6, -4.2, -Math.PI/2, [4.1, -3]],
};
const gente = {}, clicables = [];
oficina.agentes.forEach((c, k) => {
  const p = PUESTOS[c.nombre]; if (!p) return;
  const [x, z, rot, puerta] = p, dx = Math.sin(rot), dz = Math.cos(rot);
  const esc = escritorio(x + dx*.72, z + dz*.72, rot, c.color);
  silla(x, z, rot + Math.PI);
  const r = persona(c.color, k, MUJERES.test(c.persona || '')); r.position.set(x, -.05, z); r.rotation.y = rot; scene.add(r);
  r.traverse(o => { o.castShadow = true; o.userData.cargo = c.nombre; clicables.push(o); });
  const nom = cartel((c.persona || c.nombre).split(' ')[0], c.color, 260, 60); nom.position.set(0, 2.05, 0); r.add(nom);
  gente[c.nombre] = {c, r, casa:{x, z, rot}, puerta:{x:puerta[0], z:puerta[1]}, esc, fase:Math.random()*6, viaje:null, burbuja:null};
});
// la pantalla de KPI muestra los números reales
{ const K2 = DATOS.kpi || {}; const t = cartel(`Entrega ${K2.entrega ?? '—'} % · Dev. ${K2.devolucion ?? '—'} % · Canc. ${K2.cancelacion ?? '—'} %`, '#3ccf7e', 820, 70);
  t.position.set(1.0, 1.95, 1.4); scene.add(t); }

// ---------- Flujos de información entre cargos ----------
const FLUJOS = [
  ['Confirmador de pedidos', 'Líder de Logística', 'pedido frenado: casa y oficina mezcladas'],
  ['Gestor de tickets y CAS', 'Rastreador de oficinas', 'el CAS dice: paquete disponible en oficina'],
  ['Gestor de tickets y CAS', 'Abogado de devoluciones', 'guía devuelta sin segundo intento'],
  ['Resolutor de novedades', 'Rastreador de oficinas', 'novedad resuelta: reclama en oficina'],
  ['Auditor de calidad', 'Confirmador de pedidos', 'regla ajustada con lo que aprobó Karen'],
  ['Monitor de fallas', 'Líder de Tecnología', 'una vuelta no corrió a su hora'],
  ['Rastreador de oficinas', 'Líder de Logística', 'cliente para que Karen lo llame'],
  ['Líder de Logística', 'Gestor de tickets y CAS', 'suben las guías quietas: prioridad'],
  ['Abogado de devoluciones', 'Líder de Logística', 'ticket de fletes enviado a Dropi'],
  ['Optimizador de procesos', 'Confirmador de pedidos', 'un paso más rápido para confirmar'],
  ['Guardián de datos', 'Líder de Tecnología', 'copia de vetos y quejas guardada'],
  ['Confirmador de pedidos', 'Gestor de tickets y CAS', 'pedido confirmado sin guía hace horas'],
];
const lista = $('lista'), historial = [];
function anotar(de, a, que){
  const hora = new Date().toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit', timeZone:'America/Bogota'});
  historial.unshift(`<li><span>${hora}</span> <b>${(de.c.persona||de.c.nombre).split(' ')[0]}</b> → <b>${(a.c.persona||a.c.nombre).split(' ')[0]}</b>: ${que}</li>`);
  lista.innerHTML = historial.slice(0, 6).join('');
}
// recorrido: puesto → su puerta → puerta del compañero (un paso al lado) → y de vuelta por el mismo camino
function ruta(de, para){
  const lleg = {x: para.puerta.x + .5, z: para.puerta.z + .35};
  const ida = [{x:de.casa.x, z:de.casa.z}, de.puerta, lleg];
  if (para.c.nombre === 'Líder de Logística') ida.push({x: para.casa.x + .2, z: para.casa.z + 1.0});
  return ida;
}
function largo(pts){ let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i].x - pts[i-1].x, pts[i].z - pts[i-1].z); return s; }
function punto(pts, d){ for (let i = 1; i < pts.length; i++){ const L = Math.hypot(pts[i].x - pts[i-1].x, pts[i].z - pts[i-1].z);
  if (d <= L){ const k = L ? d/L : 0; return {x: pts[i-1].x + (pts[i].x - pts[i-1].x)*k, z: pts[i-1].z + (pts[i].z - pts[i-1].z)*k, dir: Math.atan2(pts[i].x - pts[i-1].x, pts[i].z - pts[i-1].z)}; } d -= L; }
  const a = pts[pts.length-2], b = pts[pts.length-1]; return {x:b.x, z:b.z, dir: Math.atan2(b.x - a.x, b.z - a.z)}; }
let siguiente = 1.5;
function lanzarFlujo(t){
  const libres = FLUJOS.filter(([d, a]) => gente[d] && gente[a] && !gente[d].viaje && !gente[a].viaje);
  if (!libres.length) return;
  const [d, a, que] = libres[Math.floor(Math.random()*libres.length)];
  const de = gente[d], para = gente[a], pts = ruta(de, para);
  de.viaje = {ini:t, pts, L:largo(pts), para, fase:'ida'};
  de.burbuja = cartel('📄 ' + que, de.c.color, Math.min(900, 30 + que.length*17), 60); de.burbuja.position.set(0, 2.55, 0); de.r.add(de.burbuja);
  anotar(de, para, que);
}

// Ficha de la persona
function pintarFicha(nombre){
  const g = gente[nombre] || Object.values(gente)[0]; if (!g) return;
  const c = g.c, on = c.funciones.some(trabaja);
  $('ficha').innerHTML = `<h2>Persona</h2><div class="area">${c.area || ''}</div><h3>${c.persona || c.nombre}</h3><div class="cargo">${c.nombre} <span class="pill ${on?'on':''}">${on?'trabajando ahora':'en su puesto'}</span></div><p>${c.mision}</p>` +
    c.funciones.map(a => { const t = trabaja(a), prox = proxima(a), otro = /otro chat/.test(a.dato);
      return `<div class="fun"><span class="pill ${t?'on':''}">${t?'ahora':(prox||(otro?'otro chat':'en construcción'))}</span><b>${a.nombre}</b> · ${a.hace}<div class="dato">${a.dato}</div></div>`; }).join('');
}
let elegido = 'Líder de Logística'; pintarFicha(elegido); setInterval(() => pintarFicha(elegido), 20000);
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let abajo = null;
canvas.addEventListener('pointerdown', e => abajo = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => {
  if (!abajo || Math.hypot(e.clientX-abajo[0], e.clientY-abajo[1]) > 6) return;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(clicables)[0]; if (hit){ elegido = hit.object.userData.cargo; pintarFicha(elegido); }
});

function tam(){ renderer.setSize(innerWidth, innerHeight, false); const a = innerWidth/innerHeight, v = innerWidth < 700 ? 13.5 : 9.2;
  camera.left = -v*a; camera.right = v*a; camera.top = v; camera.bottom = -v; camera.updateProjectionMatrix(); }
addEventListener('resize', tam); tam();

const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
const reloj = new THREE.Clock();
(function animar(){
  requestAnimationFrame(animar);
  const t = reloj.getElapsedTime();
  if (!quieto && t > siguiente){ lanzarFlujo(t); siguiente = t + 3.5 + Math.random()*3; }
  Object.values(gente).forEach(g => {
    const u = g.r.userData, on = g.c.funciones.some(trabaja);
    g.esc.pan.material.color.set(on ? '#3ccf7e' : g.c.color);
    if (g.viaje){
      const v = g.viaje, vel = 1.3;
      if (v.fase === 'ida' || v.fase === 'vuelta'){
        const d = (t - v.ini) * vel, pts = v.fase === 'ida' ? v.pts : [...v.pts].reverse(), q = punto(pts, Math.min(d, v.L));
        g.r.position.set(q.x, 0, q.z); g.r.rotation.y = q.dir;
        const paso = Math.sin(t*8)*.55; u.pi.rotation.x = paso; u.pd.rotation.x = -paso; u.bi.rotation.x = -paso*.7; u.bd.rotation.x = paso*.7;
        if (d >= v.L){ if (v.fase === 'ida'){ v.fase = 'charla'; v.ini = t; } else { g.viaje = null; } }
      } else {
        const p = v.para.r.position; g.r.rotation.y = Math.atan2(p.x - g.r.position.x, p.z - g.r.position.z);
        u.pi.rotation.x = u.pd.rotation.x = 0; u.bi.rotation.x = 0; u.bd.rotation.x = -.9 + Math.sin(t*4)*.2;
        v.para.r.userData.cabeza.rotation.y = Math.sin(t*2)*.25;
        if (t - v.ini > 2.2){ v.fase = 'vuelta'; v.ini = t; if (g.burbuja){ g.r.remove(g.burbuja); g.burbuja = null; } }
      }
      if (g.viaje) return;
    }
    // sentado en su puesto escribiendo
    g.r.position.set(g.casa.x, -.05, g.casa.z); g.r.rotation.y = g.casa.rot;
    u.pi.rotation.x = u.pd.rotation.x = -Math.PI/2;
    const tecla = quieto ? 0 : Math.sin(t*9 + g.fase)*.08; u.bi.rotation.x = -1.15 + tecla; u.bd.rotation.x = -1.15 - tecla;
    if (!quieto) u.cabeza.rotation.y = Math.sin(t*.4 + g.fase)*.12;
  });
  controls.update(); renderer.render(scene, camera);
})();
</script>
