<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Confirma+ · Configuración</title>
<style>body{font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:#f4f4f8;color:#141432;margin:0;min-width:380px}
header{background:radial-gradient(120% 140% at 0% 0%,#3b3b9a,#141432 60%);color:#fff;padding:16px 20px}header b{font-size:17px}header span{color:#c6f135}
main{padding:16px 20px;max-width:520px}label{display:block;font-weight:700;margin:12px 0 4px}small{color:#6b7280;font-weight:400}
input{width:100%;box-sizing:border-box;border:1px solid #d9d9e3;border-radius:9px;padding:9px 11px;font:14px inherit}
button{margin-top:16px;border:0;border-radius:9px;padding:10px 16px;font:700 14px inherit;cursor:pointer;background:#141432;color:#c6f135}
#est{margin-top:12px;font-weight:600}</style></head><body>
<header><b>⚡ Confirma+ <span>para Dropi</span></b><div>Configuración (se guarda solo en este Chrome)</div></header>
<main>
<label>Clave de la API de Lucid Bot <small>(Lucid → Configuración → API). Opcional: con ella ves el chat del cliente dentro de Dropi y le mandas el mensaje por Lucid.</small></label>
<input id="lucid_token" type="password" autocomplete="off" placeholder="Pega aquí la clave">
<label>Enlace de un chat de Lucid <small>(abre el chat de cualquier cliente y copia la dirección de arriba)</small></label>
<input id="chat_url" placeholder="https://panel.lucidbot.co/...573001234567...">
<label>Nombre de quien atiende <small>(sale en los mensajes: «soy …»)</small></label><input id="nombre" placeholder="Karen">
<label>Nombre de la tienda</label><input id="tienda" placeholder="Mi tienda">
<label>Código del país <small>(Colombia 57)</small></label><input id="pais" placeholder="57">
<button id="g">Guardar</button> <button id="p">Probar conexión con Lucid</button>
<div id="est"></div></main><script src="opciones.js"></script></body></html>
